name: Build Jarvis APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show which zip will be used (for debugging)
        run: ls -la *.zip

      - name: Unzip project (any zip file present)
        run: |
          ZIPFILE=$(ls *.zip | head -n 1)
          echo "Unzipping: $ZIPFILE"
          unzip -o "$ZIPFILE" -d .

      - name: Verify the fix is present (fails early with a clear message if not)
        run: |
          FILE="JarvisAssistant/app/src/main/java/com/originalassistant/jarvis/ui/components/AssistantOrb.kt"
          if grep -q "import androidx.compose.ui.graphics.drawscope.rotate" "$FILE"; then
            echo "OK: fix is present in AssistantOrb.kt"
          else
            echo "ERROR: the uploaded zip still has the OLD broken AssistantOrb.kt (missing rotate import)."
            echo "You uploaded the wrong/old zip file. Please upload the latest fixed zip."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
          sudo unzip -q -d /opt/gradle /tmp/gradle.zip
          echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: JarvisAssistant
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: JarvisAssistant/app/build/outputs/apk/debug/*.apk
